<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} - Joshua Chu{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ '/dnd/dndstyles.css' | relative_url }}">

</head>

<body>
    <header data-pageType="{{ layout.page_type }}" data-layout="{{ page.layout }}" data-custom_js="{{ page.custom_js | default: layout.custom_js }}">
        <nav>
            <div class="navbar-brand">
                <span class="navbar-name">Joshua Chu</span>
            </div>
            <div class="navbar-links">
                <div class="navbar-item"><a class="navbar-link" href="/">Home</a></div>
                <div class="navbar-item"><a class="navbar-link" href="/games" data-short="Games">Video Games</a></div>
                <div class="navbar-item"><a class="navbar-link" href="/software">Software</a></div>
                <div class="navbar-item">
                    <a class="navbar-link" href="/dnd/">D&D</a>
                    <div class="navbar-dropdown">
                        <a class="navbar-link" href="/dnd/">Wiki</a>
                        <a class="navbar-link" href="/journeysend/">Journey's End</a>
                        <a class="navbar-link" href="/dnd/portfolio">Portfolio</a>
                    </div>
                </div>
                <div class="navbar-item"><a class="navbar-link" href="/#about">About</a></div>
                <div class="navbar-item"><a class="navbar-link" href="/#about">Contact</a></div>
            </div>
        </nav>
    </header>
    <header class="mobile" data-pageType="{{ layout.page_type }}" data-layout="{{ page.layout }}" data-custom_js="{{ page.custom_js | default: layout.custom_js }}">
        <nav>
            <div class="navbar-brand">
                <span class="navbar-name">Joshua Chu</span>
            </div>
            <div class="navbar-links">
                <div class="navbar-item"><a class="navbar-link" href="/">Home</a></div>
                <div class="navbar-item"><a class="navbar-link" href="/games" data-short="Games">Video Games</a></div>
                <div class="navbar-item"><a class="navbar-link" href="/software">Software</a></div>
                <div class="navbar-item">
                    <a class="navbar-link" href="/dnd/">D&D</a>
                    <div class="navbar-dropdown">
                        <a class="navbar-link" href="/dnd/">Wiki</a>
                        <a class="navbar-link" href="/journeysend/">Journey's End</a>
                        <a class="navbar-link" href="/dnd/portfolio">Portfolio</a>
                    </div>
                </div>
                <div class="navbar-item"><a class="navbar-link" href="/#about">About</a></div>
                <div class="navbar-item"><a class="navbar-link" href="/#about">Contact</a></div>
            </div>
        </nav>
    </header>

    <div id="content-container" class="content-container">
        {{ content }}
    </div>
</body>
</html>
