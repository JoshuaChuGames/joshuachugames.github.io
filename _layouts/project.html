---
layout: base
---
<section class="hero small">
    <div class="hero-body">
        <video autoplay muted playsinline loop>
            <source src="/assets/hero_2.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="hero-content text-centered line-height-small small all-caps">
            <div class="bottom-line">
                <h1>Video Games</h1>
                <h3 class="wide-letter-spacing thin-letters">Explore my game projects!</h3>
            </div>
        </div>
    </div>
</section>

<section class="content-section project-content">
    <div class="project-media-container">
        {% assign media = page.media %}
        {% for item in media %}
            {% if item.type == "image" %}
                <img class="project-media" src="{{ item.src | relative_url }}" alt="{{ item.alt | default: page.title }}" />
            {% elsif item.type == "video" %}
                <video class="project-media" controls playsinline>
                    <source src="{{ item.src | relative_url }}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            {% endif %}
        {% endfor %}
    </div>
    {{ content }}
</section>
