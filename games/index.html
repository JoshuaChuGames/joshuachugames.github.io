---
layout: base
---
<section class="hero small">
    <div class="hero-body">
        <video autoplay muted playsinline loop>
            <source src="/assets/hero_2.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="hero-content text-centered line-height-small small all-caps">
            <div class="bottom-line">
                <h1>Video Games</h1>
                <h3 class="wide-letter-spacing thin-letters">Explore my game projects!</h3>
            </div>
        </div>
    </div>
</section>

<section class="content-section">
    <div class="projects">
        {% for game in site.games %}
            <div class="project-column">
                <div class="project-card">
                    <div class="project-image" >
                        <a href="{{ game.url }}">
                            <img src="{{ site.url }}{{ game.image }}" alt="{{ game.title }}" />
                        </a>
                    </div>
                    <div class="project-content">
                        <h2>{{ game.title }}</h2>
                        <p>{{ game.description }}</p>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</section>
