---
layout: base
---
<section class="hero small">
    <div class="hero-body">
        <video autoplay muted playsinline loop>
            <source src="/assets/hero_2.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="hero-content text-centered line-height-small small all-caps">
            <div class="bottom-line">
                <h1>Video Games</h1>
                <h3 class="wide-letter-spacing thin-letters">Explore my game projects!</h3>
            </div>
        </div>
    </div>
</section>

<section class="content-section">
    <div class="projects">
        {% for game in site.games %}
            <div class="project-column">
                <div class="project-card">
                    <a href="{{ game.url }}">
                        <div class="project-card-image" >
                                <img src="{{ game.image | relative_url }}" alt="{{ game.title }}" />

                        </div>
                        <div class="project-card-content">
                            <h1>{{ game.title }}</h1>
                            <p class="project-date">{{ game.start_date }}{% if game.end_date and game.end_date != "" %} - {{ game.end_date }} {% endif %}</p>
                            <div class="project-tags">
                                {% for tag in game.tags %}
                                    <div class="project-tag">{{ tag }}</div>
                                {% endfor %}
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        {% endfor %}
    </div>
</section>
